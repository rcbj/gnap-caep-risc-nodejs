#
# Runs the library's test suite and build, then builds the demo app's container and checks what it serves.
#
#   test    `npm test` (node:test against the stub authorization server and the stub transmitter,
#           and the setup script's plan), the TypeScript build (strict), and the check that the committed
#           package.json versions follow VERSION.
#   demo    builds the image from the repo-root Dockerfile, starts it with a throwaway key pair, waits
#           for its health check, and checks the sign-in page and the security headers. It does not
#           call /login: that discovers the authorization server, and this job has none.
#
# Nothing is pushed: the image is built for this run only. Publishing the library is npm-publish.yml's job.
name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Library tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 24.22.1, the 21 October 2026 security release fixing HTTP2Shell / Node2Shell (CVE-2026-111497),
        # the Dockerfile's; 22.18 is the oldest that runs the TypeScript sources as they are.
        node: ['22.18.0', '24.22.1']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check the manifests follow VERSION
        run: node scripts/version.mjs --check-manifests

  demo:
    name: Demo container
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci

      - name: Make the demo's key
        run: |
          set -euo pipefail
          npm run generate-key -- --config demo/gnap.json --cn localhost
          chmod a+rx demo/generated
          chmod a+r demo/generated/*

      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: gnap-caep-risc-nodejs-demo:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the container
        run: |
          docker run -d --name gnap-demo --network host -v "$PWD/demo/generated:/app/demo/generated:ro" gnap-caep-risc-nodejs-demo:ci
          for i in $(seq 1 30); do
            status="$(docker inspect -f '{{.State.Health.Status}}' gnap-demo)"
            [ "$status" = healthy ] && { echo "healthy after ${i}s"; exit 0; }
            [ "$(docker inspect -f '{{.State.Running}}' gnap-demo)" = true ] || break
            sleep 1
          done
          docker logs gnap-demo >&2
          exit 1

      - name: Smoke-test what it serves
        run: |
          set -euo pipefail
          BASE=http://localhost:3000
          fail() { echo "FAIL: $*" >&2; exit 1; }
          curl -s -D /tmp/h -o /tmp/page.html "$BASE/"
          header() { grep -i "^$1:" /tmp/h | head -1 | cut -d' ' -f2- | tr -d '\r'; }
          csp="$(header Content-Security-Policy)"
          echo "$csp" | grep -q "default-src 'none'" || fail "CSP lacks default-src 'none'"
          echo "$csp" | grep -q "frame-ancestors 'none'" || fail "CSP lacks frame-ancestors 'none'"
          [ "$(header X-Frame-Options)" = DENY ] || fail "X-Frame-Options is not DENY"
          grep -q 'Sign in with GNAP' /tmp/page.html || fail "the home page is not the sign-in page"
          echo "Smoke test passed."

      - name: Container logs
        if: always()
        run: docker logs gnap-demo 2>&1 | tail -50 || true
